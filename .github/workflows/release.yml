name: Release

# Push a tag like v0.1.0 to publish; install.sh downloads these files. Each platform is built and
# smoke-tested on its own kind of runner, so nothing is published that has not started on that OS and CPU.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tests
        run: go test -count=1 ./...

      - name: Build
        run: scripts/build-release.sh "${{ github.ref_name }}" "${{ matrix.platform }}"

      # Run the packaged binary from an unrelated directory: it must start, report the tagged version
      # and work out a local port mapping.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          tar -xzf "dist/release/lport-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" -C "$dir"
          cd /
          test "$("$dir/lport" --version)" = "${{ github.ref_name }}"
          "$dir/lport" --test-port 3000 | grep -q "localhost:"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum lport-*.tar.gz > SHA256SUMS && cat SHA256SUMS

      # Works either way round: pushing a tag creates the release here; creating the release in GitHub's UI
      # (which creates the tag) leaves it as written and attaches the files to it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" release/* --repo "$REPO" --title "$TAG" --generate-notes
          fi
